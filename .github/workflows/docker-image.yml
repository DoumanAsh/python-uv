name: Docker

on:
  # Once a week
  schedule:
    - cron: '0 0 * * 0'
  push:
    paths:
      - '.github/workflows/docker-image.yml'
      - 'Dockerfile'
    branches:
      - master
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - '**'
    paths:
      - '.github/workflows/docker-image.yml'
      - 'Dockerfile'

jobs:
  container:
    name: "${{ github.event.repository.name }}:${{matrix.python_version}}"
    if: github.event.pull_request.draft == false
    permissions:
      contents: read
      packages: write
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        python_version:
          - 3.13
          - 3.14
          - 3.15
    uses: DoumanAsh/douman-ci/.github/workflows/release-container.yaml@master
    secrets:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      DOCKER_TOKEN: ${{ secrets.DOCKER_TOKEN }}
      QUAY_TOKEN: ${{ secrets.QUAY_TOKEN }}
    with:
      # Make sure to create repos in all container registries using the same name as the repo
      image_name: ${{ github.event.repository.name }}
      container_file: "Dockerfile"
      use_oci: true
      platform: "linux"
      archs: "amd64 arm64"
      upload_container: ${{ github.event_name != 'pull_request' }}
      docker_user: "douman"
      github_user: "doumanash"
      quay_user: "doumanash"
      quay_bot_suffix: "python-uv-ci"
      build_args: |
        PYTHON_VERSION=${{ matrix.python_version }}
      post_build_script: |
          PYTHON_VERSION=$(podman run --rm localhost/${{ github.event.repository.name }} python --version | cut -d" " -f2)
          echo "- Python version: $PYTHON_VERSION" >> $GITHUB_STEP_SUMMARY
          PYTHON_SHORT_VERSION=$(echo "$PYTHON_VERSION" | cut -d"." -f 1,2)

          if [ "$PYTHON_SHORT_VERSION" = "3.15" ]; then
              echo "tags=latest $PYTHON_VERSION $PYTHON_SHORT_VERSION" >> "$GITHUB_OUTPUT"
          else
              echo "tags=$PYTHON_VERSION $PYTHON_SHORT_VERSION" >> "$GITHUB_OUTPUT"
          fi
